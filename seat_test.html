<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚宴座位編排助手 - 20桌文華東方總覽版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .custom-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03); }
        .table-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .table-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08); }
        .drag-over-seat { background-color: #ffe4e6 !important; border-color: #f43f5e !important; transform: scale(1.15) !important; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4) !important; z-index: 30; }
        .drag-over-pool { background-color: #f0fdf4 !important; border-color: #22c55e !important; border-style: dashed !important; }
        .dragging { opacity: 0.4; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); } 70% { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }
        .animate-pulse-ring { animation: pulse-ring 1.5s infinite; }
        @keyframes pulse-ring-amber { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); } 70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
        .animate-pulse-ring-amber { animation: pulse-ring-amber 1.5s infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .table-round-box { width: 280px; height: 280px; position: relative; margin: 0 auto; user-select: none; }
        .table-center-circle { width: 110px; height: 110px; position: absolute; left: 85px; top: 85px; border-radius: 9999px; }
        .seat-item { width: 40px; height: 40px; position: absolute; border-radius: 9999px; }
        .svg-table-node { cursor: pointer; transition: transform 0.2s; }
        .svg-table-node:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div id="app" class="max-w-7xl mx-auto px-4 py-6 md:py-10">

        <!-- 搜尋與操作工具列 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-100 custom-shadow mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-80">

                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 text-sm">

            </div>

            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>

                <button onclick="exportBackupJSON()" class="flex-1 md:flex-none px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition shadow-sm flex items-center justify-center gap-1.5" title="匯出完整進度備份">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>

                <label class="flex-1 md:flex-none px-4 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-sm font-medium transition border border-indigo-100 cursor-pointer flex items-center justify-center gap-1.5" title="載入進度備份">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>

                <button onclick="exportToCSV()" class="flex-1 md:flex-none px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition border border-slate-200 flex items-center justify-center gap-1.5">
                    匯出 CSV

                <button onclick="confirmReset()" class="flex-1 md:flex-none px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-medium transition border border-red-100 flex items-center justify-center">
                    重設/清空紀錄
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 左側：待分配賓客名單 -->
            <div class="lg:col-span-1 flex flex-col gap-4">
                <div class="bg-white rounded-3xl border border-slate-100 custom-shadow p-5 flex flex-col h-[750px] sticky top-6">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                            待分配賓客池
                        </h3>
                        <span id="pool-count" class="text-xs bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full font-bold">0 人</span>
                    </div>

                    <div class="space-y-2 mb-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">快速新增賓客</div>
                        <input type="text" id="quick-name" placeholder="輸入姓名" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-rose-500">
                        <div class="flex gap-2">
                            <select id="quick-relation" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-rose-500">
                                <option value="">選擇關係</option>
                                <option value="新郎親戚">新郎親戚</option>
                                <option value="新郎朋友">新郎朋友</option>
                                <option value="新郎同事">新郎同事</option>
                                <option value="新郎長官">新郎長官</option>
                                <option value="新娘親戚">新娘親戚</option>
                                <option value="新娘朋友">新娘朋友</option>
                                <option value="新娘同事">新娘同事</option>
                                <option value="新娘長官">新娘長官</option>
                            </select>
                            <select id="quick-diet" class="bg-white border border-slate-200 rounded-lg text-xs px-2 focus:outline-none focus:border-rose-500">
                                <option value="葷">葷食</option>
                                <option value="素">素食</option>
                            </select>
                        </div>
                        <input type="text" id="quick-group" placeholder="群組(選填，輸入相同名稱綁定)" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-rose-500">
                        <button onclick="addGuestToPool()" class="w-full py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold transition">
                            加入待分配池
                        </button>
                    </div>

                    <div id="unassigned-pool" 
                         ondragover="allowDrop(event)" 
                         ondragleave="dragLeavePool(event)" 
                         ondrop="dropOnPool(event)" 
                         class="flex-1 overflow-y-auto space-y-2 p-2 rounded-2xl border-2 border-transparent bg-slate-50/50 no-scrollbar relative min-h-[250px]">
                        <div id="pool-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 text-slate-400">
                            <svg class="w-8 h-8 mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            <p class="text-xs">名單目前是空的</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：20 桌次全覽列表 -->
            <div class="lg:col-span-3 flex flex-col gap-4">
                <div class="flex justify-between items-center bg-white px-5 py-3 rounded-2xl border border-slate-100 custom-shadow mb-2">
                    <span class="font-black text-slate-700 text-sm flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        宴會廳全桌次總覽 (第 1 - 20 桌)
                    </span>
                    <span class="text-xs text-slate-400">支援每桌 10 ~ 12 人彈性容量調整</span>
                </div>

                <div id="table-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </div>
    </div>

    <!-- 自訂確認視窗 -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 text-center">
            <h3 id="confirm-title" class="text-lg font-bold text-slate-800 mb-2">確認提示</h3>
            <p id="confirm-message" class="text-sm text-slate-500 mb-6">您確定要執行此操作嗎？</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirm(false)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium transition">取消</button>
                <button id="confirm-yes-btn" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-sm font-medium shadow-sm transition">確認</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyArA1kr4canBuLG4-6_m73Ove3lPCW1Mrc",
            authDomain: "my-wedding-seating.firebaseapp.com",
            databaseURL: "https://my-wedding-seating-default-rtdb.firebaseio.com",
            projectId: "my-wedding-seating",
            storageBucket: "my-wedding-seating.firebasestorage.app",
            messagingSenderId: "216730196119",
            appId: "1:216730196119:web:fc04c7ecf1cfd9941b31d2"
        };

        const TOTAL_TABLES = 20;
        let db = null;
        let isFirebaseConnected = false;
        let isSavingFromClient = false;
        let initialDataLoaded = false;

        let seats = [];
        let tableNames = {};
        let unassignedPool = []; 
        let searchQuery = '';
        let expandedTables = new Set();
        let selectedEntity = null; 

        // 1018_20_2.pdf 精準 20 桌座標 (無舞板)
        const MANDARIN_TABLE_COORDS = {
            1:  { x: 375, y: 305 },
            2:  { x: 470, y: 305 },
            3:  { x: 565, y: 305 },
            4:  { x: 330, y: 210 },
            5:  { x: 425, y: 210 },
            6:  { x: 520, y: 210 },
            7:  { x: 330, y: 575 },
            8:  { x: 425, y: 575 },
            9:  { x: 520, y: 575 },
            10: { x: 350, y: 685 },
            11: { x: 445, y: 685 },
            12: { x: 540, y: 685 },
            13: { x: 650, y: 210 },
            14: { x: 745, y: 245 },
            15: { x: 650, y: 320 },
            16: { x: 745, y: 370 },
            17: { x: 650, y: 440 },
            18: { x: 745, y: 495 },
            19: { x: 650, y: 560 },
            20: { x: 745, y: 620 }
        };

        window.onload = function() {
            // 關鍵修復：立即先讀取本機快照並繪製畫面，絕不卡在連線中
            loadFromLocalStorage();
            render();
            updateCloudStatus(false, "本地模式 (正在嘗試同步雲端...)");

            try {
                if (typeof firebase !== 'undefined') {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    db = firebase.database();
                    setupRealtimeSync();

                    // 5 秒連線超時防護
                    setTimeout(() => {
                        if (!initialDataLoaded) {
                            updateCloudStatus(false, "雲端回應較慢，已啟用本機安全存檔模式");
                        }
                    }, 5000);
                } else {
                    updateCloudStatus(false, "離線本地儲存模式");
                }
            } catch (e) {
                console.warn("Firebase 連線例外，切換本機模式:", e);
                updateCloudStatus(false, "離線本地儲存模式");
            }
        };

        function setupRealtimeSync() {
            const dbRef = db.ref('wedding_seating');
            dbRef.on('value', (snapshot) => {
                initialDataLoaded = true;
                if (isSavingFromClient) return;
                const data = snapshot.val();
                if (data && data.seats) {
                    seats = Array.isArray(data.seats) ? data.seats : Object.values(data.seats);
                    seats = seats.filter(s => s.tableNum <= TOTAL_TABLES);
                    unassignedPool = Array.isArray(data.unassignedPool) ? data.unassignedPool : Object.values(data.unassignedPool || {});
                    tableNames = data.tableNames || {};
                    if (data.expandedTables) expandedTables = new Set(data.expandedTables);
                } else {
                    // 若雲端為空，保留目前本機資料並上傳初始備份
                    saveToStorage(true);
                }
                isFirebaseConnected = true;
                updateCloudStatus(true, "雲端已連線 (即時同步中)");
                render();
            }, (error) => {
                console.warn("Firebase 讀取受限:", error);
                isFirebaseConnected = false;
                updateCloudStatus(false, "雲端未就緒，已切換本地模式儲存");
            });
        }

        function updateCloudStatus(online, text) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const container = document.getElementById('cloud-status');

            statusText.innerText = text;
            if (online) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                container.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded-full mb-2 border border-emerald-100";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-amber-500";
                container.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold bg-amber-50 text-amber-700 rounded-full mb-2 border border-amber-100";
            }
        }

        function loadFromLocalStorage() {
            const savedSeats = localStorage.getItem('mandarin_seats_20t_v2');
            const savedPool = localStorage.getItem('mandarin_pool_20t_v2');
            const savedExpanded = localStorage.getItem('mandarin_expanded_20t_v2');
            const savedTableNames = localStorage.getItem('mandarin_tablenames_20t_v2');

            if (savedSeats) {
                try {
                    seats = JSON.parse(savedSeats).filter(s => s.tableNum <= TOTAL_TABLES);
                } catch (e) {
                    generateEmptyGrid();
                }
            } else {
                generateEmptyGrid();
            }

            if (savedPool) {
                try { unassignedPool = JSON.parse(savedPool); } catch(e) { unassignedPool = []; }
            } else {
                unassignedPool = [];
            }

            if (savedExpanded) {
                try { expandedTables = new Set(JSON.parse(savedExpanded)); } catch(e) {}
            }
            if (savedTableNames) {
                try { tableNames = JSON.parse(savedTableNames); } catch(e) {}
            }
        }

        function generateEmptyGrid() {
            seats = [];
            for (let t = 1; t <= TOTAL_TABLES; t++) {
                for (let s = 1; s <= 10; s++) {
                    seats.push({ id: `table-${t}-${s}`, tableNum: t, seatNum: s, name: '', relation: '', group: '', diet: '葷', isLeader: false });
                }
            }
        }

        let saveTimeout = null;
        function saveToStorage(immediate = false) {
            const doSave = () => {
                const payload = {
                    seats: seats,
                    unassignedPool: unassignedPool,
                    tableNames: tableNames,
                    expandedTables: [...expandedTables]
                };

                localStorage.setItem('mandarin_seats_20t_v2', JSON.stringify(seats));
                localStorage.setItem('mandarin_pool_20t_v2', JSON.stringify(unassignedPool));
                localStorage.setItem('mandarin_expanded_20t_v2', JSON.stringify([...expandedTables]));

                if (isFirebaseConnected && db) {
                    isSavingFromClient = true;
                    db.ref('wedding_seating').set(payload).then(() => {
                        setTimeout(() => { isSavingFromClient = false; }, 300);
                    }).catch(() => {
                        isSavingFromClient = false;
                    });
                }
            };

            if (immediate) {
                if (saveTimeout) clearTimeout(saveTimeout);
                doSave();
            } else {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(doSave, 300);
            }
        }

        function swapWholeTable(fromTableNum, targetTableNumStr) {
            const targetTableNum = parseInt(targetTableNumStr);
            if (!targetTableNum || targetTableNum === fromTableNum) return;

            const fromSeats = seats.filter(s => s.tableNum === fromTableNum).map(s => ({ ...s }));
            const toSeats = seats.filter(s => s.tableNum === targetTableNum).map(s => ({ ...s }));

            fromSeats.forEach(s => {
                s.tableNum = targetTableNum;
                s.id = `table-${targetTableNum}-${s.seatNum}`;
            });
            toSeats.forEach(s => {
                s.tableNum = fromTableNum;
                s.id = `table-${fromTableNum}-${s.seatNum}`;
            });

            const otherSeats = seats.filter(s => s.tableNum !== fromTableNum && s.tableNum !== targetTableNum);
            seats = [...otherSeats, ...fromSeats, ...toSeats];

            const tempName = tableNames[`table-${fromTableNum}`] || '';
            tableNames[`table-${fromTableNum}`] = tableNames[`table-${targetTableNum}`] || '';
            tableNames[`table-${targetTableNum}`] = tempName;

            saveToStorage(true);
            render();
            showToast(`已成功將 第 ${fromTableNum} 桌 與 第 ${targetTableNum} 桌整桌對調！`, 'success');

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                let text = "";
                try {
                    const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                    text = utf8Decoder.decode(buffer);
                } catch (err) {
                    const big5Decoder = new TextDecoder('big5');
                    text = big5Decoder.decode(buffer);
                }

                const lines = text.split(/\r?\n/);
                let importedCount = 0;
                let autoAssignedCount = 0;
                const newGuests = [];

                let nameIdx = 0, relationIdx = 1, dietIdx = 2, groupIdx = 3;

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const cols = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));

                    if (index === 0 && (cols.some(c => c.includes('姓名') || c.includes('name') || c.includes('關係')))) {
                        cols.forEach((col, cIdx) => {
                            if (col.includes('姓名') || col.includes('name')) nameIdx = cIdx;
                            if (col.includes('關係') || col.includes('relation')) relationIdx = cIdx;
                            if (col.includes('飲食') || col.includes('素') || col.includes('diet')) dietIdx = cIdx;
                            if (col.includes('群組') || col.includes('group') || col.includes('組')) groupIdx = cIdx;
                        });
                        return;
                    }

                    if (cols.length > nameIdx && cols[nameIdx] !== '') {
                        newGuests.push({
                            id: `guest-${Date.now()}-${index}-${Math.floor(Math.random() * 100)}`,
                            name: cols[nameIdx] || '',
                            relation: cols[relationIdx] || '',
                            diet: (cols[dietIdx] && (cols[dietIdx].includes('素') || cols[dietIdx] === 'veg')) ? '素' : '葷',
                            group: cols[groupIdx] || ''
                        });
                        importedCount++;
                    }
                });

                newGuests.sort((a, b) => {
                    const groupA = a.group || '';
                    const groupB = b.group || '';
                    if (groupA !== groupB) return groupA.localeCompare(groupB);
                    const relA = a.relation || '';
                    const relB = b.relation || '';
                    return relA.localeCompare(relB);
                });

                const groupToTable = {};
                const relationToTable = {};

                newGuests.forEach(guest => {
                    let assigned = false;
                    let targetTableNum = null;

                    if (guest.group && groupToTable[guest.group]) {
                        targetTableNum = groupToTable[guest.group];
                    } else if (!guest.group && guest.relation && relationToTable[guest.relation]) {
                        targetTableNum = relationToTable[guest.relation];
                    }

                    if (targetTableNum) {
                        const tSeats = seats.filter(s => s.tableNum === targetTableNum);
                        let emptySeat = tSeats.find(s => s.name.trim() === '');
                        
                        if (!emptySeat && tSeats.length < 12) {
                            const newSeatNum = tSeats.length + 1;
                            const newSeatId = `table-${targetTableNum}-${newSeatNum}`;
                            seats.push({
                                id: newSeatId,
                                tableNum: targetTableNum,
                                seatNum: newSeatNum,
                                name: '',
                                relation: '',
                                group: '',
                                diet: '葷',
                                isLeader: false
                            });
                            emptySeat = seats.find(s => s.id === newSeatId);
                        }

                        if (emptySeat) {
                            emptySeat.name = guest.name;
                            emptySeat.relation = guest.relation;
                            emptySeat.diet = guest.diet;
                            emptySeat.group = guest.group;
                            assigned = true;
                            autoAssignedCount++;
                        }
                    }

                    if (!assigned) {
                        for (let t = 1; t <= TOTAL_TABLES; t++) {
                            const tSeats = seats.filter(s => s.tableNum === t);
                            const emptySeats = tSeats.filter(s => s.name.trim() === '');
                            const seatedCount = tSeats.length - emptySeats.length;

                            if (seatedCount === 0 && emptySeats.length > 0) {
                                const seatToFill = emptySeats[0];
                                seatToFill.name = guest.name;
                                seatToFill.relation = guest.relation;
                                seatToFill.diet = guest.diet;
                                seatToFill.group = guest.group;
                                assigned = true;
                                autoAssignedCount++;

                                if (guest.group) groupToTable[guest.group] = t;
                                if (guest.relation) relationToTable[guest.relation] = t;
                                
                                const tableKey = `table-${t}`;
                                if (!tableNames[tableKey] || tableNames[tableKey].trim() === '') {
                                    tableNames[tableKey] = guest.group || guest.relation;
                                }
                                break;
                            }
                        }
                    }

                    if (!assigned) {
                        for (let t = 1; t <= TOTAL_TABLES; t++) {
                            const tSeats = seats.filter(s => s.tableNum === t);
                            const emptySeat = tSeats.find(s => s.name.trim() === '');
                            if (emptySeat) {
                                emptySeat.name = guest.name;
                                emptySeat.relation = guest.relation;
                                emptySeat.diet = guest.diet;
                                emptySeat.group = guest.group;
                                assigned = true;
                                autoAssignedCount++;
                                break;
                            }
                        }
                    }

                    if (!assigned) {
                        unassignedPool.push(guest);
                    }
                });

                saveToStorage(true);
                render();
                showToast(`成功讀取 ${importedCount} 位！自動同群聚入座 ${autoAssignedCount} 人。`, 'success');
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function assignEntityToSeat(source, targetSeatId) {
            const targetSeat = seats.find(s => s.id === targetSeatId);
            if (!targetSeat) return;

            if (source.type === 'pool') {
                const guestIndex = unassignedPool.findIndex(g => g.id === source.id);
                if (guestIndex === -1) return;
                const guest = unassignedPool[guestIndex];

                if (targetSeat.name.trim() !== '') {
                    unassignedPool.push({
                        id: `guest-${Date.now()}-${Math.floor(Math.random() * 100)}`,
                        name: targetSeat.name,
                        relation: targetSeat.relation,
                        diet: targetSeat.diet,
                        group: targetSeat.group
                    });
                }

                targetSeat.name = guest.name;
                targetSeat.relation = guest.relation;
                targetSeat.diet = guest.diet;
                targetSeat.group = guest.group;
                targetSeat.isLeader = false;
                unassignedPool.splice(guestIndex, 1);
            } else if (source.type === 'seat') {
                const sourceSeat = seats.find(s => s.id === source.id);
                if (!sourceSeat) return;

                const tempTarget = { name: targetSeat.name, relation: targetSeat.relation, diet: targetSeat.diet, group: targetSeat.group, isLeader: targetSeat.isLeader };
                targetSeat.name = sourceSeat.name;
                targetSeat.relation = sourceSeat.relation;
                targetSeat.diet = sourceSeat.diet;
                targetSeat.group = sourceSeat.group;
                targetSeat.isLeader = sourceSeat.isLeader;

                sourceSeat.name = tempTarget.name;
                sourceSeat.relation = tempTarget.relation;
                sourceSeat.diet = tempTarget.diet;
                sourceSeat.group = tempTarget.group;
                sourceSeat.isLeader = tempTarget.isLeader;
            }

            saveToStorage(true);
            render();
            showToast('位置編排已更新！', 'success');
        }

        function getSeatCoordinates(index, totalSeats, radius = 95, cx = 140, cy = 140, size = 40) {
            const angleDeg = -90 + (index * (360 / totalSeats));
            const angleRad = (angleDeg * Math.PI) / 180;
            const x = cx + radius * Math.cos(angleRad) - (size / 2);
            const y = cy + radius * Math.sin(angleRad) - (size / 2);
            return { x: x.toFixed(1), y: y.toFixed(1) };
        }

        function updateStats() {
            const total = seats.length;
            const seated = seats.filter(s => s.name.trim() !== '').length;
            const unassigned = unassignedPool.length;
            const meat = seats.filter(s => s.name.trim() !== '' && s.diet === '葷').length;
            const veg = seats.filter(s => s.name.trim() !== '' && s.diet === '素').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-seated').innerText = seated;
            document.getElementById('stat-unassigned').innerText = unassigned;
            document.getElementById('stat-meat').innerText = meat;
            document.getElementById('stat-veg').innerText = veg;
            document.getElementById('pool-count').innerText = `${unassigned} 人`;
        }

        function render() {
            updateStats();
            renderPool();
            renderTables();
            renderMap();

        function renderPool() {
            const poolContainer = document.getElementById('unassigned-pool');
            const emptyState = document.getElementById('pool-empty-state');
            const cards = poolContainer.querySelectorAll('.guest-item-card');
            cards.forEach(card => card.remove());

            if (unassignedPool.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                unassignedPool.forEach(guest => {
                    const div = document.createElement('div');
                    div.id = `guest-card-${guest.id}`;
                    div.className = 'guest-item-card flex items-center justify-between p-2.5 bg-white border border-slate-200 rounded-xl cursor-grab active:cursor-grabbing hover:border-slate-300 transition-all custom-shadow';
                    div.setAttribute('draggable', 'true');
                    div.addEventListener('dragstart', (e) => dragStart(e, 'pool', guest.id));
                    div.addEventListener('dragend', dragEnd);
                    div.onclick = function(e) {
                        e.stopPropagation();
                        selectEntity('pool', guest.id);
                    };

                    const dietBg = guest.diet === '素' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-700';

                    div.innerHTML = `
                        <div class="flex flex-col gap-0.5 text-left pointer-events-none">
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-slate-700 text-sm">${guest.name}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded ${dietBg} font-semibold">${guest.diet}</span>
                                ${guest.group ? `<span class="text-[10px] bg-rose-50 text-rose-600 px-1.5 py-0.5 rounded font-semibold">${guest.group}</span>` : ''}
                            </div>
                            ${guest.relation ? `<span class="text-[10px] text-slate-400 font-medium">${guest.relation}</span>` : ''}
                        </div>
                        <button onclick="event.stopPropagation(); removeGuestFromPool('${guest.id}')" class="text-slate-300 hover:text-red-500 transition p-1" title="移除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    `;
                    poolContainer.appendChild(div);
                });
            }
            poolContainer.onclick = function() { clickPoolContainer(); };

            let tableNodesSVG = '';

            for (let t = 1; t <= TOTAL_TABLES; t++) {
                const coord = MANDARIN_TABLE_COORDS[t];
                if (!coord) continue;

                const tableSeats = seats.filter(s => s.tableNum === t);
                const seated = tableSeats.filter(s => s.name.trim() !== '').length;
                const total = tableSeats.length;
                const rawName = tableNames[`table-${t}`] || '';
                const displayName = rawName.length > 5 ? rawName.substring(0, 5) + '…' : rawName;

                let strokeColor = '#3b82f6';
                let fillColor = '#ffffff';
                if (seated === total && total > 0) {
                    strokeColor = '#10b981';
                    fillColor = '#ecfdf5';

                    strokeColor = '#3b82f6';
                    fillColor = '#eff6ff';
                }

                // 椅子
                let chairsSVG = '';
                for (let i = 0; i < total; i++) {
                    const angleDeg = -90 + (i * (360 / total));
                    const angleRad = (angleDeg * Math.PI) / 180;

        function downloadMapPNG() {
            const svgElement = document.getElementById('mandarin-ballroom-svg');
            if (!svgElement) return;

            const svgString = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 2000;
                canvas.height = 1680;
                const context = canvas.getContext('2d');
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0, canvas.width, canvas.height);

                const pngURL = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngURL;
                downloadLink.download = `文華東方_20桌宴會廳平面圖_${new Date().toISOString().slice(0,10)}.png`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(blobURL);
                showToast('已成功下載 20 桌高解析平面圖 (PNG)！', 'success');
            };
            image.src = blobURL;
        }

        function downloadMapSVG() {
            const svgElement = document.getElementById('mandarin-ballroom-svg');
            if (!svgElement) return;

            const svgString = new XMLSerializer().serializeToString(svgElement);
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `文華東方_20桌宴會廳平面圖_${new Date().toISOString().slice(0,10)}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('已成功匯出 20 桌向量圖 (SVG)！', 'success');
        }
    </script>
