<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚宴座位編排助手 - 雲端即時同步版</title>
    <!-- 引入 Tailwind CSS 作為輔助，同時內建強固的獨立 CSS 確保 CDN 斷線時也絕不破版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 載入 Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        /* 核心防破版樣式（自包含 CSS，保證即便無網路或 CDN 失效也能 100% 正常顯示） */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03); }
        .table-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .table-card:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.08); }
        
        /* 圓形桌次與座位絕對尺寸保護，防止縮放崩潰 */
        .table-round-box { position: relative; width: 280px; height: 280px; margin: 12px auto; user-select: none; }
        .table-center-circle {
            position: absolute;
            width: 110px;
            height: 110px;
            left: 85px;
            top: 85px;
            border-radius: 9999px;
            background: #ffffff;
            border: 3px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding: 4px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06);
        }
        .seat-item {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
            font-size: 11px;
            font-weight: 700;
        }
        .drag-over-seat {
            background-color: #ffe4e6 !important;
            border-color: #f43f5e !important;
            transform: scale(1.18) !important;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.5) !important;
            z-index: 40 !important;
        }
        .drag-over-pool { background-color: #f0fdf4 !important; border-color: #22c55e !important; border-style: dashed !important; }
        .dragging { opacity: 0.4; }
        
        @keyframes pulse-ring { 
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); } 
            70% { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } 
        }
        .animate-pulse-ring { animation: pulse-ring 1.5s infinite; }
        
        @keyframes pulse-ring-amber { 
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); } 
            70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } 
        }
        .animate-pulse-ring-amber { animation: pulse-ring-amber 1.5s infinite; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div id="app" class="max-w-7xl mx-auto px-4 py-6 md:py-8">
        <!-- 頂部標題與連線狀態標籤 -->
        <header class="mb-6 text-center relative">
            <div id="cloud-status" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold bg-slate-100 text-slate-500 rounded-full mb-2">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span id="status-text">連線中...</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">婚宴座位編排助手</h1>
            <p class="text-slate-500 mt-2 text-xs md:text-sm">☁️ 雲端同步版（共 26 桌 / 每桌可彈性坐 10 - 12 人 / 智慧群組與關係自動分配入座）</p>
        </header>

        <!-- 數據看板 -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 custom-shadow flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">總座位</span>
                <span id="stat-total" class="text-2xl font-black text-slate-800 mt-1">260</span>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 custom-shadow flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">已入座人數</span>
                <span id="stat-seated" class="text-2xl font-black text-rose-600 mt-1">0</span>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 custom-shadow flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">未分配賓客</span>
                <span id="stat-unassigned" class="text-2xl font-black text-amber-600 mt-1">0</span>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 custom-shadow flex flex-col justify-between">
                <span class="text-xs font-medium text-slate-400">已入座葷食</span>
                <span id="stat-meat" class="text-2xl font-black text-emerald-600 mt-1">0</span>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 custom-shadow flex flex-col justify-between col-span-2 md:col-span-1">
                <span class="text-xs font-medium text-slate-400">已入座素食</span>
                <span id="stat-veg" class="text-2xl font-black text-purple-600 mt-1">0</span>
            </div>
        </div>

        <!-- 搜尋與操作工具列 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 custom-shadow mb-6 flex flex-col md:flex-row gap-3 justify-between items-center">
            <div class="relative w-full md:w-80">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜尋姓名、關係、群組、桌名或桌號..." 
                       class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 text-sm">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                <label class="flex-1 md:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition shadow-sm cursor-pointer flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    匯入 CSV 名單
                    <input type="file" accept=".csv" class="hidden" onchange="importCSV(event)">
                </label>
                <button onclick="saveData()" class="flex-1 md:flex-none px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition shadow-sm flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                    強制雲端同步
                </button>
                <button onclick="exportToCSV()" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition border border-slate-200 flex items-center justify-center gap-1.5">
                    匯出 CSV
                </button>
                <button onclick="confirmReset()" class="flex-1 md:flex-none px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-semibold transition border border-red-100 flex items-center justify-center">
                    重設所有座位
                </button>
            </div>
        </div>

        <!-- 核心內容：左側名單池、右側桌次 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 左側：待分配賓客池 -->
            <div class="lg:col-span-1 flex flex-col gap-4">
                <div class="bg-white rounded-3xl border border-slate-200 custom-shadow p-4 flex flex-col h-[760px]">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                            待分配賓客池
                        </h3>
                        <span id="pool-count" class="text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded-full font-bold">0 人</span>
                    </div>

                    <!-- 快速手動新增 -->
                    <div class="space-y-2 mb-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                        <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">手動新增賓客</div>
                        <input type="text" id="quick-name" placeholder="賓客姓名" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-rose-500">
                        <div class="flex gap-1.5">
                            <select id="quick-relation" class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-rose-500">
                                <option value="">選擇關係</option>
                                <option value="新郎親戚">新郎親戚</option>
                                <option value="新郎朋友">新郎朋友</option>
                                <option value="新郎同事">新郎同事</option>
                                <option value="新郎長官">新郎長官</option>
                                <option value="新娘親戚">新娘親戚</option>
                                <option value="新娘朋友">新娘朋友</option>
                                <option value="新娘同事">新娘同事</option>
                                <option value="新娘長官">新娘長官</option>
                            </select>
                            <select id="quick-diet" class="bg-white border border-slate-200 rounded-lg text-xs px-2 focus:outline-none focus:border-rose-500">
                                <option value="葷">葷食</option>
                                <option value="素">素食</option>
                            </select>
                        </div>
                        <input type="text" id="quick-group" placeholder="群組名稱 (例如: 大學同學)" class="w-full px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-rose-500">
                        <button onclick="addGuestToPool()" class="w-full py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold transition">
                            加入待分配池
                        </button>
                    </div>

                    <!-- 待分配賓客列表容器 -->
                    <div id="unassigned-pool" 
                         ondragover="allowDrop(event)" 
                         ondragleave="dragLeavePool(event)"
                         ondrop="dropOnPool(event)" 
                         class="flex-1 overflow-y-auto space-y-2 p-2 rounded-2xl border-2 border-transparent bg-slate-50/70 no-scrollbar relative min-h-[200px]">
                        <div id="pool-empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 text-slate-400">
                            <svg class="w-8 h-8 mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                            <p class="text-xs">名單目前是空的</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：桌次與分頁區 -->
            <div class="lg:col-span-3 flex flex-col gap-3">
                <div class="flex border-b border-slate-200 mb-2 gap-2">
                    <button id="tab-groom" onclick="switchTab('groom')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-blue-600 text-blue-600 transition focus:outline-none flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                        男方桌次 (1 - 13 桌)
                    </button>
                    <button id="tab-bride" onclick="switchTab('bride')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition focus:outline-none flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span>
                        女方桌次 (1 - 13 桌)
                    </button>
                </div>

                <div id="table-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
            </div>
        </div>
    </div>

    <!-- 自訂提示視窗 -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 text-center">
            <h3 id="confirm-title" class="text-base font-bold text-slate-800 mb-2">確認提示</h3>
            <p id="confirm-message" class="text-xs text-slate-500 mb-6">您確定要執行此操作嗎？</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirm(false)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition">取消</button>
                <button id="confirm-yes-btn" class="px-5 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-semibold shadow-sm transition">確認</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyArA1kr4canBuLG4-6_m73Ove3lPCW1Mrc",
            authDomain: "my-wedding-seating.firebaseapp.com",
            databaseURL: "https://my-wedding-seating-default-rtdb.firebaseio.com",
            projectId: "my-wedding-seating",
            storageBucket: "my-wedding-seating.appspot.com",
            messagingSenderId: "367205267595",
            appId: "1:367205267595:web:e3995543c7b2829b555d49"
        };

        let db = null;
        let isFirebaseConnected = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseConnected = true;
        } catch (e) {
            console.warn("Firebase 未啟用，自動轉為 LocalStorage 模式。", e);
        }

        let seats = [];
        let tableNames = {};
        let unassignedPool = []; 
        let currentTab = 'groom'; 
        let searchQuery = '';
        let expandedTables = new Set();
        let selectedEntity = null; 

        window.onload = function() {
            if (isFirebaseConnected) {
                setupRealtimeSync();
            } else {
                updateCloudStatus(false, "本地端儲存模式 (離線運作)");
                loadFromLocalStorage();
                render();
            }
        };

        function setupRealtimeSync() {
            const dbRef = db.ref('wedding_seating');
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.seats && data.seats.length > 0) {
                    seats = data.seats;
                    unassignedPool = data.unassignedPool || [];
                    tableNames = data.tableNames || {};
                    if (data.expandedTables) expandedTables = new Set(data.expandedTables);
                } else {
                    generateEmptyGrid();
                }
                updateCloudStatus(true, "雲端已連線 (即時同步中)");
                render();
            }, (error) => {
                updateCloudStatus(false, "雲端連線失敗，切換為本地模式");
                loadFromLocalStorage();
                render();
            });
        }

        function updateCloudStatus(online, text) {
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const container = document.getElementById('cloud-status');

            statusText.innerText = text;
            if (online) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                container.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded-full mb-2 border border-emerald-100";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-amber-500";
                container.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold bg-amber-50 text-amber-700 rounded-full mb-2 border border-amber-100";
            }
        }

        function loadFromLocalStorage() {
            const savedSeats = localStorage.getItem('wedding_seats_v8');
            const savedPool = localStorage.getItem('wedding_pool_v8');
            const savedExpanded = localStorage.getItem('wedding_expanded_v8');
            const savedTableNames = localStorage.getItem('wedding_table_names_v8');

            if (savedSeats) seats = JSON.parse(savedSeats);
            else generateEmptyGrid();

            if (savedPool) unassignedPool = JSON.parse(savedPool);
            else unassignedPool = [];

            if (savedExpanded) expandedTables = new Set(JSON.parse(savedExpanded));
            if (savedTableNames) tableNames = JSON.parse(savedTableNames);
        }

        function generateEmptyGrid() {
            seats = [];
            // 男方 13 桌，每桌預設 10 人
            for (let t = 1; t <= 13; t++) {
                for (let s = 1; s <= 10; s++) {
                    seats.push({ id: `groom-${t}-${s}`, side: 'groom', tableNum: t, seatNum: s, name: '', relation: '', group: '', diet: '葷', isLeader: false });
                }
            }
            // 女方 13 桌，每桌預設 10 人
            for (let t = 1; t <= 13; t++) {
                for (let s = 1; s <= 10; s++) {
                    seats.push({ id: `bride-${t}-${s}`, side: 'bride', tableNum: t, seatNum: s, name: '', relation: '', group: '', diet: '葷', isLeader: false });
                }
            }
            saveToStorage();
        }

        function saveToStorage() {
            const payload = {
                seats: seats,
                unassignedPool: unassignedPool,
                tableNames: tableNames,
                expandedTables: [...expandedTables]
            };

            localStorage.setItem('wedding_seats_v8', JSON.stringify(seats));
            localStorage.setItem('wedding_pool_v8', JSON.stringify(unassignedPool));
            localStorage.setItem('wedding_expanded_v8', JSON.stringify([...expandedTables]));
            localStorage.setItem('wedding_table_names_v8', JSON.stringify(tableNames));

            if (isFirebaseConnected && db) {
                db.ref('wedding_seating').set(payload);
            }
        }

        function saveData() {
            saveToStorage();
            showToast('婚宴座位資料已同步上傳至雲端！', 'success');
        }

        function confirmReset() {
            showConfirm('重設座位確認', '確定要徹底清空所有賓客席次，恢復為 26 桌空席嗎？', function() {
                generateEmptyGrid();
                unassignedPool = [];
                tableNames = {};
                expandedTables.clear();
                saveToStorage();
                selectedEntity = null;
                render();
                showToast('已重設所有席位！', 'success');
            });
        }

        // 🌟 嚴格限制每桌容量在 10 到 12 人
        function changeTableCapacity(side, tableNum, delta) {
            const tableSeats = seats.filter(s => s.side === side && s.tableNum === tableNum);
            const currentCount = tableSeats.length;
            const newCount = currentCount + delta;

            if (newCount < 10 || newCount > 12) {
                showToast('每桌席位容量限制為 10 到 12 人！', 'warning');
                return;
            }

            if (delta > 0) {
                const newSeatNum = currentCount + 1;
                seats.push({
                    id: `${side}-${tableNum}-${newSeatNum}`,
                    side: side,
                    tableNum: tableNum,
                    seatNum: newSeatNum,
                    name: '',
                    relation: '',
                    group: '',
                    diet: '葷',
                    isLeader: false
                });
                showToast(`已將 ${side === 'groom' ? '男方' : '女方'} 第 ${tableNum} 桌擴充至 ${newCount} 席`, 'success');
            } else {
                const lastSeat = tableSeats.find(s => s.seatNum === currentCount);
                if (lastSeat && lastSeat.name.trim() !== '') {
                    showToast('最後一個席位已有賓客，請先移出賓客再縮減桌次！', 'warning');
                    return;
                }
                seats = seats.filter(s => !(s.side === side && s.tableNum === tableNum && s.seatNum === currentCount));
                showToast(`已將 ${side === 'groom' ? '男方' : '女方'} 第 ${tableNum} 桌縮減至 ${newCount} 席`, 'info');
            }

            saveToStorage();
            render();
        }

        // 🌟 整桌資料對調（無論容量是否相同皆安全無痛對調）
        function swapWholeTable(fromSide, fromTableNum, targetTableNumStr) {
            const targetTableNum = parseInt(targetTableNumStr);
            if (!targetTableNum || targetTableNum === fromTableNum) return;

            seats.forEach(seat => {
                if (seat.side === fromSide) {
                    if (seat.tableNum === fromTableNum) seat.tableNum = -999;
                    else if (seat.tableNum === targetTableNum) seat.tableNum = fromTableNum;
                }
            });

            seats.forEach(seat => {
                if (seat.side === fromSide && seat.tableNum === -999) {
                    seat.tableNum = targetTableNum;
                }
            });

            const sourceTableId = `${fromSide}-${fromTableNum}`;
            const targetTableId = `${fromSide}-${targetTableNum}`;
            const tempName = tableNames[targetTableId] || '';
            tableNames[targetTableId] = tableNames[sourceTableId] || '';
            tableNames[sourceTableId] = tempName;

            saveToStorage();
            render();
            const sideText = fromSide === 'groom' ? '男方' : '女方';

        // 安全 CSV 解析（支援欄位內含引號與逗點）
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // 🌟 核心修復：群組與關係智慧聚類自動入座演算法
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let text = e.target.result;
                if (text.charCodeAt(0) === 0xFEFF) {
                    text = text.slice(1); // 去除 UTF-8 BOM
                }
                const lines = text.split(/\r?\n/);
                let importedCount = 0;
                let autoAssignedCount = 0;
                const newGuests = [];

                let nameIdx = 0, relationIdx = 1, dietIdx = 2, groupIdx = 3;

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const cols = parseCSVLine(line);

                    // 檢查第一行是否為標題欄（Header）
                    if (index === 0 && cols.some(c => c.includes('姓名') || c.includes('name') || c.includes('群組') || c.includes('關係'))) {
                        cols.forEach((col, cIdx) => {
                            if (col.includes('姓名') || col.includes('name')) nameIdx = cIdx;
                            else if (col.includes('關係') || col.includes('relation')) relationIdx = cIdx;
                            else if (col.includes('飲食') || col.includes('素') || col.includes('diet')) dietIdx = cIdx;
                            else if (col.includes('群組') || col.includes('group') || col.includes('組')) groupIdx = cIdx;
                        });
                        return;
                    }

                    if (cols.length > nameIdx && cols[nameIdx] !== '') {
                        const name = cols[nameIdx] || '';
                        const relation = cols[relationIdx] || '';
                        const rawDiet = cols[dietIdx] || '';
                        const group = cols[groupIdx] || '';
                        const diet = (rawDiet.includes('素') || rawDiet.toLowerCase() === 'veg') ? '素' : '葷';

                        // 判斷男女方歸屬
                        let side = 'groom';
                        if (relation.includes('新娘') || relation.includes('女方')) {
                            side = 'bride';
                        } else if (relation.includes('新郎') || relation.includes('男方')) {
                            side = 'groom';
                        } else {
                            side = currentTab;
                        }

                        newGuests.push({
                            id: `guest-${Date.now()}-${index}-${Math.floor(Math.random() * 100)}`,
                            name,
                            relation,
                            diet,
                            group,
                            side
                        });
                        importedCount++;
                    }
                });

                // 核心聚類排序：方別 -> 群組 -> 關係，保證同一批人緊密相鄰處理
                newGuests.sort((a, b) => {
                    if (a.side !== b.side) return a.side === 'groom' ? -1 : 1;
                    if (a.group && !b.group) return -1;
                    if (!a.group && b.group) return 1;
                    if (a.group && b.group && a.group !== b.group) return a.group.localeCompare(b.group);
                    return (a.relation || '').localeCompare(b.relation || '');
                });

                // 動態桌次映射表
                const groupTableMap = { groom: {}, bride: {} };
                const relationTableMap = { groom: {}, bride: {} };

                newGuests.forEach(guest => {
                    let assigned = false;
                    const side = guest.side;
                    const sideSeats = seats.filter(s => s.side === side);

                    let targetTableNum = null;

                    // 1. 優先尋找同群組的現有桌號
                    if (guest.group && groupTableMap[side][guest.group]) {
                        targetTableNum = groupTableMap[side][guest.group];
                    } 
                    // 2. 其次尋找同關係的現有桌號
                    else if (!guest.group && guest.relation && relationTableMap[side][guest.relation]) {
                        targetTableNum = relationTableMap[side][guest.relation];
                    }

                    // 嘗試入座指定對應桌
                    if (targetTableNum) {
                        const tSeats = sideSeats.filter(s => s.tableNum === targetTableNum);
                        let emptySeat = tSeats.find(s => s.name.trim() === '');

                        // 若該桌預設席位滿了，且尚未達到 12 人絕對上限，自動擴充該桌席位
                        if (!emptySeat && tSeats.length < 12) {
                            const newSeatNum = tSeats.length + 1;
                            const newSeatId = `${side}-${targetTableNum}-${newSeatNum}`;
                            seats.push({
                                id: newSeatId,
                                side: side,
                                tableNum: targetTableNum,
                                seatNum: newSeatNum,
                                name: '',
                                relation: '',
                                group: '',
                                diet: '葷',
                                isLeader: false
                            });
                            emptySeat = seats.find(s => s.id === newSeatId);
                        }

                        if (emptySeat) {
                            emptySeat.name = guest.name;
                            emptySeat.relation = guest.relation;
                            emptySeat.diet = guest.diet;
                            emptySeat.group = guest.group;
                            assigned = true;
                            autoAssignedCount++;
                        } else {
                            // 該桌已達 12 人絕對上限，釋放映射並開啟新桌
                            if (guest.group) delete groupTableMap[side][guest.group];
                            if (guest.relation) delete relationTableMap[side][guest.relation];
                        }
                    }

                    // 3. 若無對應桌或原桌已滿 12 人，開闢全新空桌或尋找空位最多的桌子
                    if (!assigned) {
                        const tablesInfo = [];
                        for (let t = 1; t <= 13; t++) {
                            const tSeats = sideSeats.filter(s => s.tableNum === t);
                            const emptySeats = tSeats.filter(s => s.name.trim() === '');
                            const seatedCount = tSeats.length - emptySeats.length;
                            tablesInfo.push({ tableNum: t, emptySeats, seatedCount, tSeats });
                        }

                        // 優先找完全沒人坐的空桌
                        let bestTable = tablesInfo.find(t => t.seatedCount === 0 && t.emptySeats.length > 0);
                        // 其次找剩餘空位最多的桌子
                        if (!bestTable) {
                            tablesInfo.sort((a, b) => b.emptySeats.length - a.emptySeats.length);
                            bestTable = tablesInfo.find(t => t.emptySeats.length > 0);
                        }

                        if (bestTable && bestTable.emptySeats.length > 0) {
                            const seatToFill = bestTable.emptySeats[0];
                            seatToFill.name = guest.name;
                            seatToFill.relation = guest.relation;
                            seatToFill.diet = guest.diet;
                            seatToFill.group = guest.group;
                            assigned = true;
                            autoAssignedCount++;

                            // 綁定此桌至該群組/關係，後續成員將持續加入同一桌
                            if (guest.group) groupTableMap[side][guest.group] = bestTable.tableNum;
                            if (guest.relation) relationTableMap[side][guest.relation] = bestTable.tableNum;

                            // 若該桌尚未命名，自動以群組或關係命名
                            const tableId = `${side}-${bestTable.tableNum}`;
                            if (!tableNames[tableId] || tableNames[tableId].trim() === '') {
                                tableNames[tableId] = guest.group || guest.relation;
                            }
                        }
                    }

                    // 若全部 13 桌皆額滿，則放入待分配名單
                    if (!assigned) {
                        unassignedPool.push({
                            id: guest.id,
                            name: guest.name,
                            relation: guest.relation,
                            diet: guest.diet,
                            group: guest.group
                        });
                    }
                });

                saveToStorage();
                render();
                showToast(`成功匯入 ${importedCount} 位！自動同群組/關係入座 ${autoAssignedCount} 人。`, 'success');
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function assignEntityToSeat(source, targetSeatId) {
            const targetSeat = seats.find(s => s.id === targetSeatId);
            if (!targetSeat) return;

            if (source.type === 'pool') {
                const guestIndex = unassignedPool.findIndex(g => g.id === source.id);
                if (guestIndex === -1) return;
                const guest = unassignedPool[guestIndex];

                if (targetSeat.name.trim() !== '') {
                    unassignedPool.push({
                        id: `guest-${Date.now()}-${Math.floor(Math.random() * 100)}`,
                        name: targetSeat.name,
                        relation: targetSeat.relation,
                        diet: targetSeat.diet,
                        group: targetSeat.group
                    });
                }

                targetSeat.name = guest.name;
                targetSeat.relation = guest.relation;
                targetSeat.diet = guest.diet;
                targetSeat.group = guest.group;
                targetSeat.isLeader = false;
                unassignedPool.splice(guestIndex, 1);
            } else if (source.type === 'seat') {
                const sourceSeat = seats.find(s => s.id === source.id);
                if (!sourceSeat) return;

                const tempTarget = { name: targetSeat.name, relation: targetSeat.relation, diet: targetSeat.diet, group: targetSeat.group, isLeader: targetSeat.isLeader };
                targetSeat.name = sourceSeat.name;
                targetSeat.relation = sourceSeat.relation;
                targetSeat.diet = sourceSeat.diet;
                targetSeat.group = sourceSeat.group;
                targetSeat.isLeader = sourceSeat.isLeader;

                sourceSeat.name = tempTarget.name;
                sourceSeat.relation = tempTarget.relation;
                sourceSeat.diet = tempTarget.diet;
                sourceSeat.group = tempTarget.group;
                sourceSeat.isLeader = tempTarget.isLeader;
            }

            saveToStorage();
            render();
            showToast('席位編排已更新！', 'success');
        }

        // 🌟 嚴謹計算環繞座位像素座標，圓形尺寸永久受控
        function getSeatCoordinates(index, totalSeats, radius = 95, cx = 140, cy = 140, size = 40) {
            const angleDeg = -90 + (index * (360 / totalSeats));
            const angleRad = (angleDeg * Math.PI) / 180;
            const x = cx + radius * Math.cos(angleRad) - (size / 2);
            const y = cy + radius * Math.sin(angleRad) - (size / 2);
            return { x: x.toFixed(1), y: y.toFixed(1) };
        }

            document.getElementById('stat-meat').innerText = meat;
            document.getElementById('stat-veg').innerText = veg;
            document.getElementById('pool-count').innerText = `${unassigned} 人`;
        }

                        <div class="flex flex-col gap-0.5 text-left pointer-events-none">
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-slate-700 text-xs">${guest.name}</span>
                                <span class="text-[9px] px-1 py-0.2 rounded ${dietBg} font-bold">${guest.diet}</span>
                                ${guest.group ? `<span class="text-[9px] bg-rose-50 text-rose-600 px-1 py-0.2 rounded font-bold">${guest.group}</span>` : ''}
                            </div>
                            ${guest.relation ? `<span class="text-[10px] text-slate-400 font-medium">${guest.relation}</span>` : ''}
                        </div>
                        <button onclick="event.stopPropagation(); removeGuestFromPool('${guest.id}')" class="text-slate-300 hover:text-red-500 transition p-1" title="移除">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    `;
                    poolContainer.appendChild(div);
                });
            }
            poolContainer.onclick = function() { clickPoolContainer(); };
        }

        function renderTables() {
            const container = document.getElementById('table-container');
            container.innerHTML = '';
            const activeSeats = seats.filter(s => s.side === currentTab);

            for (let t = 1; t <= 13; t++) {
                const tableSeats = activeSeats.filter(s => s.tableNum === t);
                const tableId = `${currentTab}-${t}`;
                const customName = tableNames[tableId] || '';
                const totalTableSeats = tableSeats.length;
                
                let hasSearchResult = false;
                if (searchQuery) {
                    hasSearchResult = tableSeats.some(s => 
                        s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        s.relation.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (s.group && s.group.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        customName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        `第 ${t} 桌`.includes(searchQuery) || `${t}桌`.includes(searchQuery)
                    );
                }

                const opacityClass = (searchQuery && !hasSearchResult) ? 'opacity-30' : 'opacity-100';
                const seatedInTable = tableSeats.filter(s => s.name.trim() !== '').length;
                const vegInTable = tableSeats.filter(s => s.name.trim() !== '' && s.diet === '素').length;

                let seatsCircleHTML = '';
                tableSeats.forEach((seat, idx) => {
                    const coords = getSeatCoordinates(idx, totalTableSeats);
                    const isSeated = seat.name.trim() !== '';
                    
                    let circleStyle = '';
                    let contentHTML = '';
                    const isVeg = isSeated && seat.diet === '素';
                    const vegBadge = isVeg ? `<span style="position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:#10b981;color:#fff;font-size:8px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:bold;border:1px solid #fff;">素</span>` : '';
                    const leaderBadge = seat.isLeader ? `<span style="position:absolute;top:-8px;left:-2px;font-size:10px;" title="桌長">👑</span>` : '';

                    let highlightBorder = '';
                    if (searchQuery && seat.name.toLowerCase().includes(searchQuery.toLowerCase()) && isSeated) {
                        highlightBorder = 'border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,0.4); transform:scale(1.1); z-index:20;';
                    }

                    let selectedBorder = '';
                    if (selectedEntity && selectedEntity.type === 'seat' && selectedEntity.id === seat.id) {
                        selectedBorder = 'border-color:#f43f5e; box-shadow:0 0 0 3px rgba(244,63,94,0.4); transform:scale(1.15); z-index:20;';
                    }

                    if (isSeated) {
                        const bgStyle = currentTab === 'groom' 
                            ? (seat.isLeader ? 'background:#fef3c7; border:1px solid #f59e0b; color:#78350f;' : 'background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8;')
                            : (seat.isLeader ? 'background:#fef3c7; border:1px solid #f59e0b; color:#78350f;' : 'background:#fff1f2; border:1px solid #fecdd3; color:#be123c;');
                        circleStyle = `${bgStyle} cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,0.05);`;
                        const displayName = seat.name.length > 4 ? seat.name.substring(0, 4) : seat.name;
                        contentHTML = `<span style="display:block; width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none;">${displayName}</span>`;
                    } else {
                        circleStyle = 'border:1px dashed #cbd5e1; background:#f8fafc; color:#94a3b8;';
                        contentHTML = `<span style="pointer-events:none; font-size:10px;">${seat.seatNum}</span>`;
                    }

                    seatsCircleHTML += `
                        <div id="seat-circle-${seat.id}" 
                             class="seat-item"
                             style="left: ${coords.x}px; top: ${coords.y}px; ${circleStyle} ${highlightBorder} ${selectedBorder}"
                             draggable="${isSeated ? 'true' : 'false'}"
                             onclick="event.stopPropagation(); clickSeatRow('${seat.id}')"
                             ondragstart="event.stopPropagation(); dragStart(event, 'seat', '${seat.id}')"
                             ondragend="dragEnd(event)"
                             ondragover="allowDrop(event)"
                             ondragenter="dragEnterCircle(event, '${seat.id}')"
                             ondragleave="dragLeaveCircle(event, '${seat.id}')"
                             ondrop="dropOnSeat(event, '${seat.id}')"
                             title="${isSeated ? `${seat.isLeader ? '[桌長] ' : ''}${seat.name} (${seat.relation || '無關係'}) ${seat.group ? `[${seat.group}]` : ''} - ${seat.diet}食` : `空席 ${seat.seatNum}`}">
                            ${contentHTML}
                            ${vegBadge}
                            ${leaderBadge}
                        </div>
                    `;
                });

                const sideName = currentTab === 'groom' ? '男方' : '女方';
                let swapOptionsHTML = `<option value="">↔️ 整桌對調</option>`;
                for (let targetT = 1; targetT <= 13; targetT++) {
                    if (targetT !== t) {
                        const targetName = tableNames[`${currentTab}-${targetT}`];
                        swapOptionsHTML += `<option value="${targetT}">改至第 ${targetT} 桌 ${targetName ? `(${targetName})` : ''}</option>`;
                    }
                }

                const centerTableHTML = `
                    <div class="table-center-circle">
                        <span style="font-size:9px; font-weight:700; color:#94a3b8;">${sideName} 第 ${t} 桌</span>
                        <input type="text" value="${customName}" placeholder="輸入桌名"
                               style="font-size:11px; font-weight:800; color:#1e293b; text-align:center; background:transparent; border-bottom:1px dashed #cbd5e1; outline:none; width:90%; margin:2px 0;"
                               onchange="updateTableName('${tableId}', this.value)">
                        <div style="display:flex; gap:3px; font-size:8px; font-weight:700; color:#64748b;">
                            <span style="background:#f1f5f9; padding:1px 3px; border-radius:4px;">坐: ${seatedInTable}/${totalTableSeats}</span>
                            ${vegInTable > 0 ? `<span style="background:#f3e8ff; color:#7e22ce; padding:1px 3px; border-radius:4px;">素: ${vegInTable}</span>` : ''}
                        </div>
                    </div>
                `;

                const tableRoundArea = `
                    <div class="table-round-box">
                        ${centerTableHTML}
                        ${seatsCircleHTML}
                    </div>
                `;

                const isOpen = expandedTables.has(tableId) ? 'open' : '';
                let detailRowsHTML = '';
                tableSeats.forEach(seat => {
                    const isSeated = seat.name.trim() !== '';
                    const defaultRelations = ['新郎親戚', '新郎朋友', '新郎同事', '新郎長官', '新娘親戚', '新娘朋友', '新娘同事', '新娘長官'];
                    let relationOptions = `<option value="" ${seat.relation === '' ? 'selected' : ''}>關係</option>`;
                    if (seat.relation !== '' && !defaultRelations.includes(seat.relation)) {
                        relationOptions += `<option value="${seat.relation}" selected>${seat.relation}</option>`;
                    }
                    defaultRelations.forEach(r => {
                        relationOptions += `<option value="${r}" ${seat.relation === r ? 'selected' : ''}>${r}</option>`;
                    });

                    detailRowsHTML += `
                        <div class="flex items-center gap-1.5 p-1.5 bg-white rounded-xl border border-slate-200 text-xs hover:bg-slate-50 transition">
                            <div class="flex items-center font-bold text-slate-400 shrink-0 w-8 text-[10px] pl-1">
                                ${seat.seatNum}
                            </div>
                            <div class="grid grid-cols-12 gap-1 w-full items-center">
                                <div class="col-span-4">
                                    <input type="text" value="${seat.name}" placeholder="空席" 
                                           class="w-full bg-transparent font-bold border-b border-transparent hover:border-slate-300 focus:border-rose-500 outline-none text-slate-700 text-xs"
                                           onchange="updateSeatDetail('${seat.id}', 'name', this.value)">
                                </div>
                                <div class="col-span-3">
                                    <select onchange="updateSeatDetail('${seat.id}', 'relation', this.value)" 
                                            class="w-full bg-transparent border-b border-transparent hover:border-slate-300 focus:border-rose-500 text-slate-500 outline-none text-[10px] font-medium truncate">
                                        ${relationOptions}
                                    </select>
                                </div>
                                <div class="col-span-3">
                                    <input type="text" value="${seat.group || ''}" placeholder="群組" 
                                           class="w-full bg-transparent border-b border-transparent hover:border-slate-300 focus:border-rose-500 outline-none text-slate-500 text-[10px] truncate"
                                           onchange="updateSeatDetail('${seat.id}', 'group', this.value)">
                                </div>
                                <div class="col-span-2">
                                    <select onchange="updateSeatDetail('${seat.id}', 'diet', this.value)" 
                                            class="w-full bg-transparent border-b border-transparent hover:border-slate-300 focus:border-rose-500 outline-none font-bold text-[10px] ${seat.diet === '素' ? 'text-purple-600' : 'text-slate-600'}">
                                        <option value="葷" ${seat.diet === '葷' ? 'selected' : ''}>葷</option>
                                        <option value="素" ${seat.diet === '素' ? 'selected' : ''}>素</option>
                                    </select>
                                </div>
                            </div>
                            ${isSeated ? `
                            <button onclick="toggleLeader('${seat.id}')" class="p-1 rounded transition ${seat.isLeader ? 'bg-amber-100 text-amber-700 font-bold' : 'text-slate-300 hover:text-amber-500'}" title="設定/取消桌長">
                                👑
                            </button>
                            <button onclick="unseatGuest('${seat.id}')" class="text-slate-300 hover:text-amber-500 transition p-1" title="移回待分配名單">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
                            </button>` : '<div class="w-6 shrink-0"></div>'}
                        </div>
                    `;
                });

                const collapseArea = `
                    <details class="w-full bg-slate-50/70 border border-slate-200 rounded-2xl overflow-hidden transition" ${isOpen}>
                        <summary onclick="event.preventDefault(); toggleTableExpand('${tableId}')" 
                                 class="px-3.5 py-2 text-xs font-bold text-slate-600 hover:text-slate-800 cursor-pointer focus:outline-none flex justify-between items-center bg-slate-100/70">
                            <span class="flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/>
                                </svg>
                                ${isOpen ? '折疊詳細名單' : '展開名單編輯 (桌長/容量/微調)'}
                            </span>
                            <div class="flex items-center gap-1.5">
                                <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-1.5 py-0.5" onclick="event.stopPropagation()">
                                    <span class="text-[10px] text-slate-400 font-bold">容量:</span>
                                    <button onclick="changeTableCapacity('${currentTab}', ${t}, -1)" class="w-4 h-4 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center text-xs">-</button>
                                    <span class="text-[10px] text-slate-800 font-black px-1">${totalTableSeats}</span>
                                    <button onclick="changeTableCapacity('${currentTab}', ${t}, 1)" class="w-4 h-4 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center text-xs">+</button>
                                </div>
                            </div>
                        </summary>
                        <div class="p-2 space-y-1 border-t border-slate-200 bg-slate-50/40">
                            ${detailRowsHTML}
                        </div>
                    </details>
                `;

                const tableCard = document.createElement('div');
                tableCard.className = `table-card bg-white rounded-3xl border border-slate-200 custom-shadow p-3.5 flex flex-col gap-2 ${opacityClass}`;
                tableCard.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <span class="text-xs font-black text-slate-800 flex items-center gap-1">
                            ${sideName} 第 ${t} 桌
                            ${customName ? `<span class="text-rose-600 font-bold">(${customName})</span>` : ''}
                        </span>
                        <div class="flex items-center gap-2">
                            <select onchange="swapWholeTable('${currentTab}', ${t}, this.value)" 
                                    class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold px-2 py-1 rounded-lg outline-none cursor-pointer border border-slate-200 transition">
                                ${swapOptionsHTML}
                            </select>
                            <div class="text-[10px] font-bold text-slate-400">
                                坐: <span class="text-rose-500 font-black">${seatedInTable}</span>/${totalTableSeats}
                            </div>
                        </div>
                    </div>
                    ${tableRoundArea}
                    ${collapseArea}
                `;

                container.appendChild(tableCard);
            }
        }
    </script>
</body>
</html>
